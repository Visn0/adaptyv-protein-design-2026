<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  </style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="44" fill="white" font-size="16" font-weight="700">Campaign 1 — generation strategies, per-design speed (Gantt)</text>
  <text x="40" y="64" fill="#94a3b8" font-size="9">measured on RTX 5070 (12 GB), free machine · track A = genie3 arm (local) · track B = RFD4 arm (hosted)</text>

  <!-- axis -->
  <g font-size="8" fill="#64748b">
    <text x="320" y="94" text-anchor="middle">0</text>
    <text x="425" y="94" text-anchor="middle">2</text>
    <text x="530" y="94" text-anchor="middle">4</text>
    <text x="635" y="94" text-anchor="middle">6</text>
    <text x="740" y="94" text-anchor="middle">8</text>
    <text x="845" y="94" text-anchor="middle">10</text>
    <text x="950" y="94" text-anchor="middle">12</text>
    <text x="1055" y="94" text-anchor="middle">14</text>
    <text x="1155" y="94" text-anchor="middle">16 min</text>
  </g>
  <g stroke="#1e293b" stroke-width="0.7" stroke-dasharray="3,5">
    <line x1="320" y1="100" x2="320" y2="472"/>
    <line x1="425" y1="100" x2="425" y2="472"/>
    <line x1="530" y1="100" x2="530" y2="472"/>
    <line x1="635" y1="100" x2="635" y2="472"/>
    <line x1="740" y1="100" x2="740" y2="472"/>
    <line x1="845" y1="100" x2="845" y2="472"/>
    <line x1="950" y1="100" x2="950" y2="472"/>
    <line x1="1055" y1="100" x2="1055" y2="472"/>
    <line x1="1160" y1="100" x2="1160" y2="472"/>
  </g>

  <!-- track A header -->
  <text x="40" y="118" fill="#22d3ee" font-size="11" font-weight="700">Track A · genie3 arm (local GPU + CPU)</text>

  <g font-size="11" font-weight="600" fill="white">
    <text x="40" y="147">genie3 generation</text>
    <text x="40" y="189">ProteinMPNN sequencing</text>
    <text x="40" y="231">Boltz-2 coarse co-fold</text>
    <text x="40" y="273">Chai-1 restrained co-fold</text>
  </g>
  <g font-size="9" fill="#94a3b8">
    <text x="40" y="161">local GPU · est 4–8 GiB · 50 s</text>
    <text x="40" y="203">CPU-only · off the critical path</text>
    <text x="40" y="245">GPU 10–11.3 GiB · 4.1 min</text>
    <text x="40" y="287">GPU 11.2–11.7 GiB · 8.5 min</text>
  </g>

  <!-- track A bars: genie3 0-0.83, MPNN 0.83-2.83, boltz 2.83-6.93, chai 6.93-15.43 -->
  <rect x="320" y="129" width="44" height="22" rx="3" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="356" y="144" fill="white" font-size="9" font-weight="600" text-anchor="end">50 s</text>
  <rect x="364" y="171" width="105" height="22" rx="3" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="462" y="186" fill="#a7f3d0" font-size="8.5" text-anchor="end">2 min · overlaps GPU</text>
  <rect x="469" y="213" width="215" height="22" rx="3" fill="rgba(120,53,15,0.5)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="676" y="228" fill="white" font-size="9" font-weight="600" text-anchor="end">4.1 min</text>
  <rect x="684" y="255" width="446" height="22" rx="3" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1122" y="270" fill="white" font-size="9" font-weight="600" text-anchor="end">8.5 min</text>

  <!-- track A summary -->
  <text x="320" y="298" fill="#94a3b8" font-size="8.5">critical path ≈ 13.7 min/design · 96 designs ≈ 21.5 local GPU-h (folds 20.2 h of it) · MPNN hidden on CPU</text>

  <!-- track B header -->
  <text x="40" y="334" fill="#a78bfa" font-size="11" font-weight="700">Track B · RFD4 arm (hosted NIM, zero local GPU)</text>

  <g font-size="11" font-weight="600" fill="white">
    <text x="40" y="363">RFD4 generation (hosted)</text>
    <text x="40" y="405">Boltz-2 coarse co-fold</text>
    <text x="40" y="447">Chai-1 restrained co-fold</text>
  </g>
  <g font-size="9" fill="#94a3b8">
    <text x="40" y="377">remote service · no MPNN needed · 20 s/design</text>
    <text x="40" y="419">GPU 10–11.3 GiB · 4.1 min</text>
    <text x="40" y="461">GPU 11.2–11.7 GiB · 8.5 min</text>
  </g>

  <!-- track B bars: RFD4 0-0.33, boltz 0.33-4.43, chai 4.43-12.93 -->
  <rect x="320" y="345" width="18" height="22" rx="3" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="342" y="360" fill="#c4b5fd" font-size="8.5">20 s</text>
  <rect x="338" y="387" width="215" height="22" rx="3" fill="rgba(120,53,15,0.5)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="545" y="402" fill="white" font-size="9" font-weight="600" text-anchor="end">4.1 min</text>
  <rect x="553" y="429" width="446" height="22" rx="3" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="991" y="444" fill="white" font-size="9" font-weight="600" text-anchor="end">8.5 min</text>

  <!-- track B summary -->
  <text x="320" y="472" fill="#94a3b8" font-size="8.5">critical path ≈ 12.9 min/design · 96 designs ≈ 20.2 local GPU-h (folds only; generation is remote and free)</text>

  <!-- legend -->
  <g font-size="8.5" fill="#94a3b8">
    <rect x="40" y="492" width="12" height="8" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee"/>
    <text x="58" y="500">genie3 (local GPU)</text>
    <rect x="196" y="492" width="12" height="8" rx="2" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-dasharray="3,2"/>
    <text x="214" y="500">MPNN (CPU, overlaps)</text>
    <rect x="366" y="492" width="12" height="8" rx="2" fill="rgba(120,53,15,0.5)" stroke="#fbbf24"/>
    <text x="384" y="500">Boltz-2 fold</text>
    <rect x="482" y="492" width="12" height="8" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185"/>
    <text x="500" y="500">Chai-1 fold</text>
    <rect x="596" y="492" width="12" height="8" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-dasharray="3,2"/>
    <text x="614" y="500">RFD4 (hosted)</text>
  </g>

  <!-- notes -->
  <text x="40" y="524" fill="#94a3b8" font-size="9">Both strategies: the two co-folds are 97 % of the critical path; the generation choice changes it by only ~0.8 min/design.</text>
  <text x="40" y="542" fill="#94a3b8" font-size="9">Screening options: unrestrained Boltz-2 only 4.1 min (not usable on this target) · restrained Chai-1 8.5 min (used) · both 12.6 min.</text>
</svg>
